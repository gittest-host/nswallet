name: Build Android APK

on:
  workflow_dispatch:   # ✅ This allows manual runs from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: flutter pub get
        working-directory: src/nswallet   # ✅ add this line

      - name: Build APK
        run: flutter build apk --release
        working-directory: src/nswallet   # ✅ add this line

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSWallet-APK
          path: src/nswallet/build/app/outputs/flutter-apk/app-release.apk  # ✅ updated path
